# Beispiel für can-server.toml. Start: can-server can-server.toml
# Schlüssel stehen nie in dieser Datei, nur die Namen der Umgebungsvariablen.

listen = "127.0.0.1:8080"
# worker = "worker-1"              # Vorgabe: Rechnername; muss pro Worker eindeutig sein

# Verschlüsselung im Ruhezustand: Variable mit 64 Hex-Zeichen (openssl rand -hex 32).
# encryption_key_env = "CAN_STORE_KEY"

# Woher die genannten Secrets kommen: "env" (Vorgabe), "files" oder "vault".
# [secrets]
# kind = "vault"
# addr = "https://vault.example.com"
# path = "secret/data/can"
# token_env = "VAULT_TOKEN"

[store]
kind = "postgres"                  # oder "sqlite" (mit path) oder "memory" zum Ausprobieren
url_env = "CAN_DATABASE_URL"       # postgres://nutzer:passwort@host:5432/datenbank

[[agents]]
name = "helfer"
model = "mein-modell"
system = "Du bist ein hilfreicher Assistent."
provider = "openai"                # oder "anthropic"
# base_url = "http://localhost:11434/v1"
api_key_env = "CAN_MODEL_KEY"
tools = ["read_file", "ls", "glob", "grep", "write_todos", "http_fetch"]   # auch: write_file, edit_file, shell
# memory_file = "AGENTS.md"       # Gedächtnis: steht immer im System-Prompt
# skills_dir = "skills"           # Skills: <name>/SKILL.md, bei Bedarf geladen
workdir = "."
http_allowed_hosts = ["example.com"]
max_steps = 50
# pricing = { input_per_million = 3.0, output_per_million = 15.0 }
# isolate_workdir = true          # Vorgabe: eigenes Unterverzeichnis pro Sitzung
# confidential_tools = ["read_file"]
# exfiltration_guard = "deny"     # externe Tools sperren, sobald vertrauliche Daten im Verlauf stehen
# blocked_terms = ["Projekt Zeus"]

# Sandbox für das Tool shell: "namespaces" (unshare) oder "docker".
# [agents.sandbox]
# mode = "docker"
# image = "debian:bookworm-slim"
# network = false
# memory_mb = 512
# max_processes = 64

# [agents.mcp.suche]
# url = "https://mcp.example.com/mcp"
# token_env = "MCP_SUCHE_TOKEN"

[[agents.rules]]
tool = "http_fetch"
decision = "allow"

[[tenants]]
name = "acme"
max_concurrent_runs = 8
max_tokens = 0                     # 0 = unbegrenzt
# max_cost_cents = 5000            # Kostenbudget; braucht pricing am Agenten
# webhook_url = "https://example.com/can-ende"

[[tenants.keys]]
key_env = "ACME_ADA_KEY"           # mindestens 16 Zeichen
user = "ada"
role = "admin"                     # viewer, operator oder admin
