[package]
name = "can-providers"
description = "Modellanbieter und Fake-Provider für Tests."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
openai = ["dep:reqwest"]
anthropic = ["dep:reqwest"]
gemini = ["dep:reqwest"]
vertex = ["gemini", "anthropic"]
bedrock = ["dep:reqwest"]
all = ["openai", "anthropic", "gemini", "vertex", "bedrock"]

[dependencies]
can-core.workspace = true
async-trait.workspace = true
futures.workspace = true
reqwest = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
proptest.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "net", "io-util"] }

[lints]
workspace = true
