[package]
name = "can-runtime"
description = "Agent-Loop als Zustandsmaschine."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
can-core.workspace = true
async-trait.workspace = true
futures.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "time", "macros"] }
tokio-util.workspace = true
tracing.workspace = true

[dev-dependencies]
can-store = { workspace = true, features = ["sqlite"] }
can-macros.workspace = true
can-providers.workspace = true
proptest.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "test-util"] }

[lints]
workspace = true

[[example]]
name = "minimal"
path = "../../examples/minimal.rs"

[[example]]
name = "policy"
path = "../../examples/policy.rs"

[[example]]
name = "resume"
path = "../../examples/resume.rs"
