[package]
name = "agentkit-cli"
description = "Binary zum Ausprobieren."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
agentkit-core.workspace = true
agentkit-providers = { workspace = true, features = ["openai"] }
agentkit-tools.workspace = true
agentkit-store.workspace = true
agentkit-runtime.workspace = true
clap.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-std", "io-util"] }

[dev-dependencies]
serde_json.workspace = true
tokio = { workspace = true, features = ["net", "time"] }
[lints]
workspace = true

[[bin]]
name = "agentkit"
path = "src/main.rs"
