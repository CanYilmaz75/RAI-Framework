[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[workspace.dependencies]
agentkit-core = { path = "crates/agentkit-core" }
agentkit-providers = { path = "crates/agentkit-providers" }
agentkit-macros = { path = "crates/agentkit-macros" }
agentkit-tools = { path = "crates/agentkit-tools" }
agentkit-store = { path = "crates/agentkit-store" }
agentkit-runtime = { path = "crates/agentkit-runtime" }

async-trait = "0.1"
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
rusqlite = { version = "0.32", features = ["bundled"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["sync"] }
tokio-util = "0.7"
tracing = "0.1"
ulid = { version = "1", features = ["serde"] }

proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }

proptest = "1"
insta = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
