[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["wasm/demo-tool"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/CanYilmaz75/RAI-Framework"
publish = false

[workspace.dependencies]
can = { path = "crates/can" }
can-core = { path = "crates/can-core" }
can-providers = { path = "crates/can-providers" }
can-macros = { path = "crates/can-macros" }
can-tools = { path = "crates/can-tools" }
can-store = { path = "crates/can-store" }
can-runtime = { path = "crates/can-runtime" }
can-server = { path = "crates/can-server" }

async-trait = "0.1"
axum = "0.8"
chacha20poly1305 = "0.10"
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
rusqlite = { version = "0.32", features = ["bundled"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["sync"] }
tokio-postgres = "0.7"
tokio-util = "0.7"
toml = "1"
tracing = "0.1"
ulid = { version = "1", features = ["serde"] }
wasmtime = { version = "50", default-features = false, features = ["cranelift", "runtime", "std", "wat", "parallel-compilation"] }
wasmtime-wasi = { version = "50", default-features = false, features = ["p1"] }

proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }

proptest = "1"
insta = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

# Abhängigkeiten ohne Debug-Informationen: hält Testprogramme mit wasmtime klein.
[profile.dev.package."*"]
debug = false

[profile.dev]
debug = "line-tables-only"
